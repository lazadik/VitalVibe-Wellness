<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VitalVibe | Premium Botanical Wellness</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@300;400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1" />
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#f4a825",
                        "background-light": "#fdfaf5",
                        "background-dark": "#121212",
                        "card-light": "#ffffff",
                        "card-dark": "#1e1e1e",
                    },
                    fontFamily: {
                        display: ["DM+Serif+Display", "serif"],
                        manrope: ["Manrope", "sans-serif"],
                        sans: ["Inter", "sans-serif"],
                    },
                    borderRadius: {
                        DEFAULT: "1rem",
                        'xl': '2rem',
                    },
                },
            },
        };
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            background-color: #fdfaf5;
        }
        .font-display { font-family: 'DM+Serif+Display', serif; }
        .font-manrope { font-family: 'Manrope', sans-serif; }
        
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .fill-1 {
            font-variation-settings: 'FILL' 1;
        }

        html { scroll-behavior: smooth; }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #fdfaf5; }
        ::-webkit-scrollbar-thumb { background: #f4a825; border-radius: 10px; }

        @keyframes pageFadeIn {
            from { opacity: 0; transform: scale(0.99) translateY(5px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        .page-transition {
            animation: pageFadeIn 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        .blur-backdrop {
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .hover-lift {
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.4s ease;
        }
        .hover-lift:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 30px -10px rgb(0 0 0 / 0.1);
        }
    </style>
<script type="importmap">

}
</script>

</html>
